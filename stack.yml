# Stack Docker Swarm — DashBoard (Multi-Aplicação Oficial)
#
# Banco: oficial_db (container oficial_container), pela rede oficial_db_net —
# tabelas próprias no schema `dashboard`, vendas/meta/vendedores no schema
# `vendas`, controle de atualização em `rpa`, Log em `compartilhado`. Até a
# Onda 3 do Plano de Implementação - Migração RPA para Oficial DB
# (multi-aplicacao) lia o Postgres nativo do host (banco "sga") via
# extra_hosts/host-gateway.
#
# Réplica única (replicas: 1): o DashBoard guarda estado de sessão em memória
# do processo (st.session_state, ver pages/01_🎬_Slideshow.py) — múltiplas
# réplicas quebrariam o slideshow/tema/pausa.
#
# Imagem publicada no GHCR via scripts/deploy_local.sh (build+push manual,
# sem CI por enquanto). Deploy na VPS: docker stack deploy -c stack.yml dashboard

services:
  web:
    image: ghcr.io/arecomarcelo/dashboard:latest
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    entrypoint: ["/app/entrypoint.sh"]
    command:
      - "streamlit"
      - "run"
      - "app.py"
      - "--server.port=8113"
      - "--server.address=0.0.0.0"
      - "--server.headless=true"
      - "--browser.gatherUsageStats=false"
      - "--server.enableWebsocketCompression=false"
    ports:
      - "127.0.0.1:8113:8113"
    networks:
      - traefik_public
      - oficial_db_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8113/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      # Fase 6 da auditoria Hostinger, onda 2 (08/10/2026): pico de 7 dias × 1,5.
      resources:
        limits:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3

networks:
  # traefik_public: o Traefik foi removido em 06/10/2026 (auditoria Hostinger, D4), mas a rede
  # continua em uso — o monitor-oficial checa o /health das apps pela rede interna do Swarm
  # (http://<stack>_web:<porta>/health), e dashboard e relatorios só são alcançáveis por ela
  # (não estão na rede monitoring). Não remover.
  traefik_public:
    external: true
  oficial_db_net:
    external: true
